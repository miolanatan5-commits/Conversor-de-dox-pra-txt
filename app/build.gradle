plugins {
    id 'com.android.application'
}

android {
    namespace 'com.conversor.docxtxt'
    compileSdk 36

    defaultConfig {
        applicationId "com.conversor.docxtxt"
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
